<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lesotho Tourism - Bookings</title>
	
	<!-- Offline Fallback Styles (Bypasses Connection Blocker) -->
	<style>
		:root {
			--primary: #0d6efd;
			--primary-hover: #0b5ed7;
			--dark: #212529;
			--light: #f8f9fa;
			--gray: #6c757d;
			--border: #ced4da;
		}
		body {
			margin: 0;
			font-family: system-ui, -apple-system, sans-serif;
			background-color: var(--light);
			color: var(--dark);
		}
		.container {
			max-width: 800px;
			margin: 0 auto;
			padding: 0 15px;
		}
		/* Navbar Layout */
		.navbar {
			background-color: var(--dark);
			padding: 1rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 2rem;
		}
		.navbar-brand {
			color: #fff;
			font-size: 1.25rem;
			text-decoration: none;
			font-weight: bold;
		}
		.navbar-nav {
			display: flex;
			list-style: none;
			padding-left: 0;
			margin: 0;
			gap: 15px;
		}
		.nav-link {
			color: rgba(255,255,255,0.65);
			text-decoration: none;
			padding: 0.5rem;
		}
		.nav-link:hover, .nav-link.active {
			color: #fff;
		}
		/* Form Structure */
		.text-center { text-align: center; }
		.my-4 { margin-top: 1.5rem; margin-bottom: 1.5rem; }
		h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--primary); }
		.lead { font-size: 1.25rem; color: var(--gray); margin-bottom: 2rem; }
		
		.booking-card {
			background: #fff;
			border: 1px solid #dee2e6;
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.05);
			padding: 30px;
			margin-bottom: 3rem;
		}
		.form-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 20px;
		}
		.col-full {
			grid-column: span 2;
		}
		@media (max-width: 600px) {
			.form-grid > div {
				grid-column: span 2;
			}
		}
		.form-group {
			display: flex;
			flex-direction: column;
		}
		.form-label {
			font-weight: 600;
			margin-bottom: 8px;
			font-size: 0.95rem;
		}
		.form-control {
			padding: 10px 12px;
			font-size: 1rem;
			border: 1px solid var(--border);
			border-radius: 6px;
			outline: none;
			font-family: inherit;
		}
		.form-control:focus {
			border-color: var(--primary);
			box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
		}
		.btn-submit {
			background-color: var(--primary);
			color: #fff;
			padding: 12px 20px;
			font-size: 1.1rem;
			font-weight: bold;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			width: 100%;
			transition: background-color 0.15s ease;
			margin-top: 10px;
		}
		.btn-submit:hover {
			background-color: var(--primary-hover);
		}
		footer {
			background-color: var(--dark);
			color: #fff;
			text-align: center;
			padding: 1rem 0;
			margin-top: 3rem;
		}
	</style>
</head>
<body>

	<!-- Navigation -->
	<nav class="navbar">
		<a class="navbar-brand" href="index.html">Lesotho Tourism</a>
		<ul class="navbar-nav">
			<li><a class="nav-link" href="index.html">Home</a></li>
			<li><a class="nav-link" href="destinations.html">Destinations</a></li>
			<li><a class="nav-link" href="activities.html">Activities</a></li>
			<li><a class="nav-link" href="accommodation.html">Accommodation</a></li>
			<li><a class="nav-link" href="gallery.html">Gallery</a></li>
			<li><a class="nav-link active" href="bookings.html">Bookings</a></li>
		</ul>
	</nav>

	<!-- Main Content Container -->
	<main class="container">
		<div class="text-center my-4">
			<h1>Travel Registration</h1>
			<p class="lead">Book your next adventure into the Kingdom in the Sky</p>
		</div>

		<!-- Registration Form Card -->
		<div class="booking-card">
			<form action="#" method="POST">
				<div class="form-grid">
					
					<!-- First Name -->
					<div class="form-group">
						<label class="form-label" for="firstName">First Name</label>
						<input type="text" id="firstName" name="firstName" class="form-control" placeholder="Motselisi" required>
					</div>

					<!-- Last Name -->
					<div class="form-group">
						<label class="form-label" for="lastName">Last Name</label>
						<input type="text" id="lastName" name="lastName" class="form-control" placeholder="Moalosi" required>
					</div>

					<!-- Email Address -->
					<div class="form-group">
						<label class="form-label" for="email">Email Address</label>
						<input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
					</div>

					<!-- Phone Number -->
					<div class="form-group">
						<label class="form-label" for="phone">Phone Number</label>
						<input type="tel" id="phone" name="phone" class="form-control" placeholder="+266 2200 0000" required>
					</div>

					<!-- Primary Destination Selection -->
					<div class="form-group">
						<label class="form-label" for="destination">Select Destination</label>
						<select id="destination" name="destination" class="form-control" required>
							<option value="" disabled selected>Choose a destination...</option>
							<option value="semonkong">Maletsunyane Falls (Semonkong)</option>
							<option value="katse">Katse Dam</option>
							<option value="afriski">Afriski Mountain Resort</option>
							<option value="sanipass">Sani Pass Lodge</option>
							<option value="tsehlanyane">Ts'ehlanyane National Park</option>
							<option value="thababosiu">Thaba-Bosiu Cultural Village</option>
						</select>
					</div>

					<!-- Number of Guests -->
					<div class="form-group">
						<label class="form-label" for="guests">Number of Travelers</label>
						<input type="number" id="guests" name="guests" class="form-control" min="1" max="20" value="1" required>
					</div>

					<!-- Arrival Date -->
					<div class="form-group">
						<label class="form-label" for="arrivalDate">Arrival Date</label>
						<input type="date" id="arrivalDate" name="arrivalDate" class="form-control" required>
					</div>

					<!-- Departure Date -->
					<div class="form-group">
						<label class="form-label" for="departureDate">Departure Date</label>
						<input type="date" id="departureDate" name="departureDate" class="form-control" required>
					</div>

					<!-- Additional Travel Notes / Requirements -->
					<div class="form-group col-full">
						<label class="form-label" for="notes">Special Requirements / Notes</label>
						<textarea id="notes" name="notes" class="form-control" rows="4" placeholder="Dietary preferences, medical considerations, or custom pony trekking requests..."></textarea>
					</div>

					<!-- Submit Button -->
					<div class="col-full">
						<button type="submit" class="btn-submit">Submit Registration</button>
					</div>

				</div>
			</form>
		</div>
	</main>

	<!-- Footer with assignment info -->
	<footer>
		<p>Student Name: Motselisi Moalosi | Student ID: 901021557</p>
	</footer>
    <!-- Native Embedded JavaScript for Bootstrap Menu Toggling (100% Offline Safe) -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var toggler = document.querySelector('.navbar-toggler');
            var collapse = document.querySelector('.navbar-collapse');
            
            if (toggler && collapse) {
                toggler.addEventListener('click', function () {
                    if (collapse.style.display === 'block') {
                        collapse.style.display = 'none';
                    } else {
                        collapse.style.display = 'block';
                    }
                });
            }
        });
    </script>

    <!-- Your Custom Project JavaScript file -->
    <script src="js/script.js"></script>

</body>
</html>
